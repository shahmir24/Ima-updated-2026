project_id = "txvwvxihvfltnidejfcs"

# Body Double AI — "Break it down". Gateway JWT verification stays ON: an
# unauthenticated call is refused before the function runs, and before any
# work is done on it. The function verifies the user again from the
# Authorization header, and holds no service-role key because it reads and
# writes no table.
[functions.ai-breakdown]
verify_jwt = true

# DEVELOPMENT SPIKE — delete with supabase/functions/push-spike. Sends one fixed
# test notification to one developer-supplied subscription. Gateway JWT
# verification stays ON, and the function itself is off (503) unless the
# PUSH_SPIKE_SECRET function secret is set and sent as x-ima-spike-secret.
[functions.push-spike]
verify_jwt = true


# Gentle nudges — the daily sender, called by Supabase Cron. Two layers: gateway
# JWT verification stays ON (Authorization must carry a valid project JWT), and
# the function itself refuses every request whose x-nudge-scheduler-secret
# header is not NUDGE_SCHEDULER_SECRET (401; 503 when that secret is unset).
[functions.send-nudges]
verify_jwt = true

# Quick Capture "Organize it". Gateway JWT verification stays ON, and the
# function verifies the session again itself. It holds no service-role key and
# touches no table: it only turns a signed-in person's text into proposals.
[functions.organize-capture]
verify_jwt = true

# Voice Brain Dump: one short recording in, its transcript out. Gateway JWT
# verification stays ON, and the function verifies the session again itself.
# It holds no service-role key, touches no table, and never stores audio.
[functions.transcribe-capture]
verify_jwt = true
